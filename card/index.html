<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cristiana Firullo</title><meta name="description" content="Cristiana Firullo, PhD Candidate, Cornell University.">
<style>*{box-sizing:border-box}body{margin:0}[hidden]{display:none!important}</style>
</head><body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&family=Public+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one column; QR on top for showing (hidden on the public copy), then name, one finding, actions */
:root{
  --bg:#f3f4f7; --card:#ffffff; --ink:#141a2b; --muted:#5b6478; --line:#dde1ea; --accent:#2b4fd8; --accent-ink:#ffffff;
  --display:"Newsreader",Georgia,"Times New Roman",serif;
  --body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1120;--card:#161c2f;--ink:#e9ecf5;--muted:#9aa3ba;--line:#283149;--accent:#8aa4ff;--accent-ink:#0d1120;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d1120;--card:#161c2f;--ink:#e9ecf5;--muted:#9aa3ba;--line:#283149;--accent:#8aa4ff;--accent-ink:#0d1120;color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:32px}
.wrap{max-width:400px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
header{display:flex;flex-direction:column;gap:8px}
h1{font-family:var(--display);font-weight:500;font-size:38px;line-height:1.05;margin:0}
.role{margin:0;color:var(--muted)}
.finding{margin:0;font-family:var(--display);font-size:20px;line-height:1.35;border-left:2px solid var(--accent);padding-left:14px}
.finding small{display:block;margin-top:6px;font-family:var(--body);font-size:13px;color:var(--muted)}
.actions{display:flex;flex-direction:column;gap:10px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:14px;border-radius:12px;font-weight:600;text-decoration:none;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:16px;font-family:var(--body);cursor:pointer}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.email{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:15px;color:var(--muted)}
.email span{overflow-wrap:anywhere;min-width:0;color:var(--ink)}
.email button{border:0;background:transparent;color:var(--accent);font:600 14px var(--body);cursor:pointer;padding:4px}
.qr{display:flex;flex-direction:column;align-items:center;gap:10px}
#qr{background:#ffffff;padding:14px;border-radius:12px;width:min(280px,100%);aspect-ratio:1;max-width:100%}
#qr svg{width:100%;height:100%;display:block}
.qr p{margin:0;font-size:13px;color:var(--muted)}
</style>

<main class="wrap">
  <section class="qr" id="scan" aria-label="Scan">
    <div id="qr" role="img" aria-label="QR code to this card"></div>
    <p>Scan to save this card</p>
  </section>
  <header>
    <h1>Cristiana Firullo</h1>
    <p class="role">PhD Candidate, Cornell University<br>Department of Economics, Stanford University</p>
  </header>

  <p class="finding">Targeted ads make consumers search longer, without leading them to better purchases.
    <small>Job market paper · with Cheyre and Acquisti</small></p>

  <div class="actions">
    <a class="btn primary" href="https://cristianafirullo.com/CV_Firullo.pdf" target="_blank" rel="noopener">CV</a>
    <a class="btn" href="https://cristianafirullo.com/research.html" target="_blank" rel="noopener">Research</a>
    <a class="btn" href="https://cristianafirullo.com/card/cristiana-firullo.vcf">Save contact</a>
    <div class="email"><span id="email">cf528@cornell.edu</span><button id="copy" type="button">Copy</button></div>
  </div>

</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script>
if(location.hostname.endsWith("cristianafirullo.com")){document.getElementById("scan").hidden=true;}
else{try{const q=qrcode(0,"M");q.addData("https://cristianafirullo.com/card/");q.make();
  document.getElementById("qr").innerHTML=q.createSvgTag({cellSize:4,margin:0,scalable:true});}
  catch(e){document.getElementById("qr").textContent="QR unavailable";}}
document.getElementById("copy").onclick=async e=>{
  const b=e.currentTarget;
  try{await navigator.clipboard.writeText("cf528@cornell.edu");b.textContent="Copied";}
  catch(_){const r=document.createRange();r.selectNodeContents(document.getElementById("email"));const s=getSelection();s.removeAllRanges();s.addRange(r);b.textContent="Selected";}
  setTimeout(()=>b.textContent="Copy",1800);
};
</script>

</body></html>
